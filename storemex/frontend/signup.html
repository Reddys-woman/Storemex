<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>storemex — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #5C7A45;
    --green-soft: #EAF2E3;
    --ink: #2B2A25;
    --dim: #837F71;
    --line: #E7E2D6;
    --cream: #FAF8F2;
    --card: #FFFFFF;
    --error: #C24A32;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    font-family: "DM Sans", sans-serif;
    color: var(--ink);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 20px 50px -20px rgba(43,42,37,0.12);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand h1 {
    font-family: "Manrope", sans-serif;
    font-size: 18px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.01em;
  }

  h2 {
    font-family: "Manrope", sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .sub {
    font-size: 14px;
    color: var(--dim);
    margin: 0 0 28px;
    line-height: 1.5;
  }

  form { display: flex; flex-direction: column; gap: 16px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: "DM Sans", sans-serif;
    font-size: 14px;
    background: var(--cream);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-soft);
  }

  input.invalid { border-color: var(--error); }

  .field-error {
    font-size: 12px;
    color: var(--error);
    margin-top: 5px;
    min-height: 14px;
  }

  .hint {
    font-size: 12px;
    color: var(--dim);
    margin-top: 5px;
  }

  button[type="submit"] {
    margin-top: 6px;
    padding: 12px;
    border: none;
    border-radius: 999px;
    background: var(--green);
    color: #fff;
    font-family: "DM Sans", sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button[type="submit"]:hover { filter: brightness(1.08); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: default; }

  .form-status {
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .form-status.success { color: var(--green); }
  .form-status.error { color: var(--error); }

  .footer-line {
    text-align: center;
    font-size: 13px;
    color: var(--dim);
    margin-top: 22px;
  }
  .footer-line a { color: var(--green); font-weight: 600; text-decoration: none; }
  .footer-line a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 3h12l-1 6H7L6 3z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.5 9h11l-1.2 10.2a2 2 0 0 1-2 1.8H9.7a2 2 0 0 1-2-1.8L6.5 9z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
    <h1>storemex</h1>
  </div>

  <h2>Create your account</h2>
  <p class="sub">Sign up to start tracking your pantry, expiry dates &amp; shopping list.</p>

  <form id="signupForm" novalidate>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      <div class="field-error" id="emailError"></div>
    </div>

    <div>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
      <div class="field-error" id="passwordError"></div>
    </div>

    <div>
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter your password" required autocomplete="new-password">
      <div class="field-error" id="confirmError"></div>
    </div>

    <button type="submit" id="submitBtn">Sign Up</button>
    <div class="form-status" id="formStatus"></div>
  </form>

  <p class="footer-line">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script>
  const form = document.getElementById("signupForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const confirmInput = document.getElementById("confirmPassword");
  const emailError = document.getElementById("emailError");
  const passwordError = document.getElementById("passwordError");
  const confirmError = document.getElementById("confirmError");
  const formStatus = document.getElementById("formStatus");
  const submitBtn = document.getElementById("submitBtn");

  function clearErrors() {
    [emailInput, passwordInput, confirmInput].forEach(el => el.classList.remove("invalid"));
    emailError.textContent = "";
    passwordError.textContent = "";
    confirmError.textContent = "";
    formStatus.textContent = "";
    formStatus.className = "form-status";
  }

  function validate() {
    let ok = true;

    const email = emailInput.value.trim();
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
      emailInput.classList.add("invalid");
      emailError.textContent = "Enter a valid email address.";
      ok = false;
    }

    const password = passwordInput.value;
    if (password.length < 8) {
      passwordInput.classList.add("invalid");
      passwordError.textContent = "Password must be at least 8 characters.";
      ok = false;
    }

    if (confirmInput.value !== password || confirmInput.value === "") {
      confirmInput.classList.add("invalid");
      confirmError.textContent = "Passwords don't match.";
      ok = false;
    }

    return ok;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors();

    if (!validate()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Signing up…";

    try {
      const res = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: emailInput.value.trim(),
          password: passwordInput.value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Signup failed");

      formStatus.textContent = "Account created! Redirecting to login…";
      formStatus.classList.add("success");
      setTimeout(() => { window.location.href = "login.html"; }, 1500);
      
    } catch (err) {
      formStatus.textContent = err.message || "Something went wrong. Try again.";
      formStatus.classList.add("error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign Up";
    }
  });
</script>

</body>
</html>
