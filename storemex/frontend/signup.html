<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>storemex — Authentication</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --green: #5C7A45;
      --green-dark: #4d683b;
      --green-soft: #EAF2E3;

      --ink: #2B2A25;
      --dim: #837F71;

      --line: #E7E2D6;
      --cream: #FAF8F2;
      --white: #FFFFFF;

      --error: #C24A32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--cream);

      font-family: "DM Sans", sans-serif;
      color: var(--ink);

      padding: 24px;
    }

    /* ---------------- CARD ---------------- */

    .auth-card {
      width: 100%;
      max-width: 520px;

      background: var(--white);

      border: 1px solid var(--line);
      border-radius: 22px;

      padding: 42px 48px;

      box-shadow:
        0 20px 50px -20px rgba(43, 42, 37, 0.12);
    }

    /* ---------------- BRAND ---------------- */

    .brand {
      display: flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 34px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;

      border-radius: 14px;

      background: var(--green);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 25px;
      height: 25px;
    }

    .brand-name {
      font-family: "Manrope", sans-serif;

      font-size: 28px;
      font-weight: 800;

      letter-spacing: -0.03em;
    }

    /* ---------------- HEADINGS ---------------- */

    h1 {
      font-family: "Manrope", sans-serif;

      font-size: 34px;
      line-height: 1.15;

      margin: 0 0 10px;

      letter-spacing: -0.03em;
    }

    .subtitle {
      color: var(--dim);

      font-size: 16px;
      line-height: 1.55;

      margin: 0 0 30px;
    }

    /* ---------------- TABS ---------------- */

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;

      background: var(--cream);

      border-radius: 12px;

      padding: 4px;

      margin-bottom: 30px;
    }

    .tab {
      border: none;
      background: transparent;

      padding: 11px;

      border-radius: 9px;

      font-family: "DM Sans", sans-serif;
      font-size: 14px;
      font-weight: 600;

      color: var(--dim);

      cursor: pointer;

      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--white);
      color: var(--green);

      box-shadow: 0 2px 8px rgba(43, 42, 37, 0.08);
    }

    /* ---------------- FORM ---------------- */

    form {
      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      font-weight: 600;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border: 1px solid var(--line);
      border-radius: 11px;

      background: var(--cream);

      color: var(--ink);

      font-family: "DM Sans", sans-serif;
      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #918d82;
    }

    input:focus {
      border-color: var(--green);

      box-shadow:
        0 0 0 3px var(--green-soft);
    }

    input.invalid {
      border-color: var(--error);
    }

    .field-error {
      min-height: 17px;

      margin-top: 5px;

      font-size: 12px;

      color: var(--error);
    }

    /* ---------------- BUTTON ---------------- */

    .submit-btn {
      width: 100%;

      margin-top: 5px;

      padding: 14px;

      border: none;
      border-radius: 999px;

      background: var(--green);

      color: white;

      font-family: "DM Sans", sans-serif;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.1s ease;
    }

    .submit-btn:hover {
      background: var(--green-dark);
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* ---------------- STATUS ---------------- */

    .status {
      min-height: 20px;

      margin-top: 4px;

      text-align: center;

      font-size: 13px;
    }

    .status.success {
      color: var(--green);
    }

    .status.error {
      color: var(--error);
    }

    /* ---------------- FOOTER ---------------- */

    .switch-text {
      text-align: center;

      margin: 26px 0 0;

      color: var(--dim);

      font-size: 14px;
    }

    .switch-link {
      border: none;
      background: none;

      padding: 0;

      color: var(--green);

      font-family: inherit;
      font-size: inherit;
      font-weight: 700;

      cursor: pointer;
    }

    .switch-link:hover {
      text-decoration: underline;
    }

    /* ---------------- HIDDEN ---------------- */

    .hidden {
      display: none;
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .auth-card {
        padding: 32px 24px;
      }

      h1 {
        font-size: 29px;
      }

      .brand-name {
        font-size: 25px;
      }

    }

  </style>
</head>


<body>

  <div class="auth-card">

    <!-- BRAND -->

    <div class="brand">

      <div class="brand-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            d="M6 3H18L17 9H7L6 3Z"
            stroke="white"
            stroke-width="1.8"
            stroke-linejoin="round"
          />

          <path
            d="M6.5 9H17.5L16.3 19.2C16.1 20.3 15.2 21 14.1 21H9.9C8.8 21 7.9 20.3 7.7 19.2L6.5 9Z"
            stroke="white"
            stroke-width="1.8"
            stroke-linejoin="round"
          />

        </svg>

      </div>

      <div class="brand-name">
        storemex
      </div>

    </div>


    <!-- TABS -->

    <div class="tabs">

      <button
        type="button"
        class="tab active"
        id="signupTab"
      >
        Sign Up
      </button>

      <button
        type="button"
        class="tab"
        id="loginTab"
      >
        Log In
      </button>

    </div>


    <!-- ================= SIGNUP ================= -->

    <div id="signupSection">

      <h1>Create your account</h1>

      <p class="subtitle">
        Sign up to start tracking your pantry, expiry dates &amp; shopping list.
      </p>


      <form id="signupForm" novalidate>

        <!-- EMAIL -->

        <div class="field">

          <label for="signupEmail">
            Email
          </label>

          <input
            type="email"
            id="signupEmail"
            placeholder="you@example.com"
            autocomplete="email"
          >

          <div
            class="field-error"
            id="signupEmailError"
          ></div>

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="signupPassword">
            Password
          </label>

          <input
            type="password"
            id="signupPassword"
            placeholder="At least 8 characters"
            autocomplete="new-password"
          >

          <div
            class="field-error"
            id="signupPasswordError"
          ></div>

        </div>


        <!-- CONFIRM -->

        <div class="field">

          <label for="confirmPassword">
            Confirm password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
          >

          <div
            class="field-error"
            id="confirmPasswordError"
          ></div>

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="signupButton"
        >
          Sign Up
        </button>


        <div
          class="status"
          id="signupStatus"
        ></div>

      </form>


      <p class="switch-text">

        Already have an account?

        <button
          type="button"
          class="switch-link"
          id="goToLogin"
        >
          Log in
        </button>

      </p>

    </div>


    <!-- ================= LOGIN ================= -->

    <div
      id="loginSection"
      class="hidden"
    >

      <h1>Welcome back</h1>

      <p class="subtitle">
        Log in to access your pantry, expiry dates &amp; shopping list.
      </p>


      <form id="loginForm" novalidate>

        <!-- EMAIL -->

        <div class="field">

          <label for="loginEmail">
            Email
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="you@example.com"
            autocomplete="email"
          >

          <div
            class="field-error"
            id="loginEmailError"
          ></div>

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Your password"
            autocomplete="current-password"
          >

          <div
            class="field-error"
            id="loginPasswordError"
          ></div>

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="loginButton"
        >
          Log In
        </button>


        <div
          class="status"
          id="loginStatus"
        ></div>

      </form>


      <p class="switch-text">

        Don't have an account?

        <button
          type="button"
          class="switch-link"
          id="goToSignup"
        >
          Sign up
        </button>

      </p>

    </div>

  </div>


<script>

  /* =========================================
     ELEMENTS
  ========================================= */

  const signupTab = document.getElementById("signupTab");
  const loginTab = document.getElementById("loginTab");

  const signupSection = document.getElementById("signupSection");
  const loginSection = document.getElementById("loginSection");

  const goToLogin = document.getElementById("goToLogin");
  const goToSignup = document.getElementById("goToSignup");


  /* =========================================
     SWITCH BETWEEN SIGNUP / LOGIN
  ========================================= */

  function showSignup() {

    signupSection.classList.remove("hidden");
    loginSection.classList.add("hidden");

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

    clearStatus();

  }


  function showLogin() {

    signupSection.classList.add("hidden");
    loginSection.classList.remove("hidden");

    signupTab.classList.remove("active");
    loginTab.classList.add("active");

    clearStatus();

  }


  signupTab.addEventListener("click", showSignup);
  loginTab.addEventListener("click", showLogin);

  goToLogin.addEventListener("click", showLogin);
  goToSignup.addEventListener("click", showSignup);


  /* =========================================
     STATUS
  ========================================= */

  function clearStatus() {

    document.getElementById("signupStatus").textContent = "";
    document.getElementById("loginStatus").textContent = "";

  }


  /* =========================================
     SIGNUP
  ========================================= */

  document
    .getElementById("signupForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();


      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      const emailError =
        document.getElementById("signupEmailError");

      const passwordError =
        document.getElementById("signupPasswordError");

      const confirmError =
        document.getElementById("confirmPasswordError");

      const status =
        document.getElementById("signupStatus");

      const button =
        document.getElementById("signupButton");


      emailError.textContent = "";
      passwordError.textContent = "";
      confirmError.textContent = "";

      status.textContent = "";
      status.className = "status";


      let valid = true;


      /* EMAIL */

      const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


      if (!emailPattern.test(email)) {

        emailError.textContent =
          "Enter a valid email address.";

        valid = false;

      }


      /* PASSWORD */

      if (password.length < 8) {

        passwordError.textContent =
          "Password must be at least 8 characters.";

        valid = false;

      }


      /* CONFIRM PASSWORD */

      if (password !== confirmPassword) {

        confirmError.textContent =
          "Passwords don't match.";

        valid = false;

      }


      if (!valid) {
        return;
      }


      button.disabled = true;
      button.textContent = "Creating account…";


      try {

        const response = await fetch(
          "http://localhost:3000/signup",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Signup failed."
          );

        }


        /* Successful signup */

        localStorage.setItem(
          "storemex_authed",
          "true"
        );


        status.textContent =
          "Account created successfully!";

        status.classList.add("success");


        setTimeout(function() {

          window.location.href = "index.html";

        }, 700);


      } catch (error) {

        console.error("Signup error:", error);

        status.textContent =
          error.message ||
          "Unable to create account.";

        status.classList.add("error");

      } finally {

        button.disabled = false;
        button.textContent = "Sign Up";

      }

    });


  /* =========================================
     LOGIN
  ========================================= */

  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();


      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      const emailError =
        document.getElementById("loginEmailError");

      const passwordError =
        document.getElementById("loginPasswordError");

      const status =
        document.getElementById("loginStatus");

      const button =
        document.getElementById("loginButton");


      emailError.textContent = "";
      passwordError.textContent = "";

      status.textContent = "";
      status.className = "status";


      let valid = true;


      /* EMAIL */

      const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


      if (!emailPattern.test(email)) {

        emailError.textContent =
          "Enter a valid email address.";

        valid = false;

      }


      /* PASSWORD */

      if (!password) {

        passwordError.textContent =
          "Enter your password.";

        valid = false;

      }


      if (!valid) {
        return;
      }


      button.disabled = true;
      button.textContent = "Logging in…";


      try {

        const response = await fetch(
          "http://localhost:3000/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Login failed."
          );

        }


        /* Successful login */

        localStorage.setItem(
          "storemex_authed",
          "true"
        );


        /* Store returned user information if available */

        if (data.user) {

          localStorage.setItem(
            "storemex_user",
            JSON.stringify(data.user)
          );

        }


        status.textContent =
          "Login successful! Redirecting…";

        status.classList.add("success");


        setTimeout(function() {

          window.location.href = "index.html";

        }, 700);


      } catch (error) {

        console.error("Login error:", error);

        status.textContent =
          error.message ||
          "Unable to log in.";

        status.classList.add("error");

      } finally {

        button.disabled = false;
        button.textContent = "Log In";

      }

    });

</script>

</body>
</html>
